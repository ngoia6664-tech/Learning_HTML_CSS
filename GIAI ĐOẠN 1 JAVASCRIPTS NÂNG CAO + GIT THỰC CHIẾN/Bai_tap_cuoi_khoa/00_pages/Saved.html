<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài viết đã lưu - Postify</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="../01_CSS/Global.css" />
  </head>
  <script type="module" src="../02_JS/Saved.js"></script>
  <body>
    
    <!-- HEADER -->
    <header class="header">
      <div class="header__logo">
        <div class="logo-icon-box"><i class="ri-article-line"></i></div>
        <span class="logo-text">Postify</span>
      </div>

      <nav class="header__menu">
        <ul>
          <li>
            <a href="../Home.html" class="menu-link">
              <i class="ri-home-line"></i>
              <span>Trang chủ</span>
            </a>
          </li>
          <li>
            <a href="Saved.html" class="menu-link active">
              <i class="ri-bookmark-fill"></i>
              <span>Bài viết đã lưu</span>
            </a>
          </li>
          <li>
            <a href="./Profile.html?userId=11" class="menu-link">
              <i class="ri-user-line"></i>
              <span>Trang cá nhân</span>
            </a>
          </li>
        </ul>
      </nav>

      <div class="header__account">
        <a href="./Profile.html?userId=11" class="account-link">
          <i class="ri-user-line"></i>
          <span>Tài khoản</span>
        </a>
      </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="main">
      
      <!-- Khối Tìm kiếm -->
      <section class="main__search">
        <div class="search-box">
          <i class="ri-search-line find-author "></i>
          <input type="text" placeholder="Tìm kiếm trong bài viết đã lưu..." />
        </div>
        <select name="search-author" id="search-author" class="search-select">
          <option value="">Tất cả tác giả</option>
          <option value="1">Tác giả 1</option>
          <option value="2">Tác giả 2</option>
        </select>
        <button class="btn btn-filter">Tìm kiếm</button>
      </section>

      <!-- Khối Danh sách bài viết đã lưu -->
      <section class="main__posts">
        <article class="posts">
           <div class="posts__head">
            <a href="/00_pages/Profile.html"><img src="../03_Assets/anh-dai-dien.jpg" alt="Ảnh tác giả" class="posts__avatar" /></a>
            <h3 class="posts__author-name">${x.username}</h3>
          </div>
          
          <div class="posts__between">
            <h3>${x.title}</h3>
            <p class="text-body posts__text">
              ${x.body}
            </p>
            <span class="event-more posts__more">Xem thêm</span>
          </div>

          <div class="posts__last">
            <div class="post__last-choose heart">
              <i class="ri-heart-line icon"></i>
              <span>Thả tim</span>
            </div>
            <div class="post__last-choose chat-3">
              <i class="ri-chat-3-line icon"></i>
              <span>Bình luận</span>
            </div>
            <div class="post__last-choose bookmark">
              <i class="ri-bookmark-line icon"></i>
              <span>Lưu bài viết</span>
            </div>
          </div>
        </article>
      </section>

      <!-- Khối Tạo bài viết -->
      <section class="main__create-post">
    <div class="create-post__head">
        <i class="ri-edit-box-line"></i>
        <h2>Tạo bài viết</h2>
    </div>
    <div class="create-post_beetween">
        <div class="create-post__author">
            <i class="ri-user-smile-line"></i>
            <h3>Ngô Duy Anh</h3>
        </div>

        <!-- Ô nhập tiêu đề có icon -->
        <div class="create-post__input-box">
            <i class="ri-heading"></i>
            <input type="text" placeholder="Nhập tiêu đề ..." value="" class="input-title-post" id="title-create-post">
        </div>

        <!-- Ô nhập nội dung -->
        <div class="create-post__textarea-box">
            <textarea placeholder="Nhập cảm nghĩ của bạn vào đây" id="content-create-post"></textarea>
        </div>

        <!-- Nút đăng bài có icon máy bay giấy -->
        <button class="btn btn-create-post">
            <i class="ri-send-plane-fill"></i>
            <span>Đăng bài viết</span>
        </button>
    </div>
</section>
    </main>
    <div class="box-comment"></div>
    <div class="box-background"></div>
  </body>
</html>
