<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="../CSS/style.css">
  </head>
  <body>
    <header><h1>Trang đăng nhập tài khoản Cineverse</h1></header>
    <main>
        <form action="#" method="post">
            <fieldset>
              <legend>Thông tin tài khoản</legend>
              <label for="username">Tên đăng nhập</label>
              <input
                type="text"
                name="username"
                id="username"
                required
                placeholder="Nguyễn Văn A"
              />
              <br />
              <br />
              <label for="password">Mật khẩu</label>
              <input
                type="password"
                name="password"
                id="password"
                required
                minlength="6"
                placeholder="Mật khẩu phải có 6 kí tự"
              />
              <br />
              <a href="#">Quên mật khẩu</a>
            </fieldset>
            <br />
            <span>Bạn chưa có tài khoản? Đến trang </span
            ><a href="Bài 7regiser finish.html">Đăng kí</a> <br /><br />
            <button type="submit">Đăng nhập</button>
        </form>
    </main>
  </body>
</html>
