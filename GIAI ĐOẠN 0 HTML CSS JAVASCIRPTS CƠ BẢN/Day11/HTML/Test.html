<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Demo align-items</title>
  <link rel="stylesheet" href="align-demo.css" />
</head>
<body>
  <h2>align-items: center (mặc định bạn hay dùng)</h2>
  <div class="box box-center">
    <a href="#">Trang chủ</a>
    <a href="#">Phim</a>
    <a href="#">Liên hệ</a>
    <a href="#">Trợ giúp lâu hơn</a>
  </div>

  <h2>align-items: stretch (giá trị mặc định thật sự của flex)</h2>
  <div class="box box-stretch">
    <a href="#">Trang chủ</a>
    <a href="#">Phim</a>
    <a href="#">Liên hệ</a>
    <a href="#">Trợ giúp lâu hơn</a>
  </div>

  <h2>Kết hợp: sidebar cao 100vh, nút "Đăng xuất" dính đáy bằng margin-top: auto</h2>
  <div class="sidebar-demo">
    <a href="#">Trang chủ</a>
    <a href="#">Phim</a>
    <a href="#">Liên hệ</a>
    <button>Đăng xuất</button>
  </div>
</body>
</html>
