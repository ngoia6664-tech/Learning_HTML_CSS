<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do=app</title>
</head>
<link rel="stylesheet" href="To-do-app.css">
<script src="To_do.js" defer></script>
<body>
    <header>
        <h1>Chào mừng bạn đến với To-do-app</h1>
    </header>
    <main>
        <form action="" method="get" id="from-to-do-app">
            <div class="div-add-tasks">
                <input type="text" class="input-tasks" placeholder="Học DOM , học ASYNC ...">
                <button type="submit" class="btn-add">Thêm công việc</button>
                <p class="p-add-tasks"></p>
            </div>
            <div class="div-list-tasks">
                <span>Danh sách công việc đã thêm</span>
                <ul class="ul-list-tasks">
                </ul>
            </div>
            <button type="button" class="Reset">reset</button>
        </form>
    </main>
    <footer>Đây là footer </footer>
</body>
</html>
