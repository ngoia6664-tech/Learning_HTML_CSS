<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day 14</title>
  </head>
  <body>
    <h1>Đang học DOM</h1>
    <p class="p1">Doraemon</p>
    <p class="p2">Conan</p>
    <p class="p3">DragonBall</p>
    <button onclick="chao()">Click me</button>
    <div class="box">
      <div class="card">thẻ 1</div>
      <div class="card">thẻ 2</div>
      <div class="card">thẻ 3</div>
      <div class="card">thẻ 4</div>
    </div>
    <button class="btn div" onclick="ClickDiv()">Click div</button>
    <div class="hop">Hop</div>
    <button class="red" onclick="ClickRed()">Red</button>
    <button class="gray" onclick="ClickGray()">Gray</button>
    <div class="Bai5">Bài 5</div>
    <button class="btn-bai5" onclick="ClickBai5()">Click Bài 5</button>
  </body>
  <style>
    body {
    }
    button {
      width: fit-content;
      height: fit-content;
      padding: 6px 12px;
      border-radius: 12px;
      box-shadow: 2px 2px 2px rgba(0, 0, 0, 0.2);
      transition: scale 0.15s;
      background-color: #121221;
      color: #f8f8f8;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      scale: 1.05;
    }
    .box {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
      gap: 24px;
      padding: 12px;
      border: 2px solid black;
      height: fit-content;
      justify-content: space-between;
      align-items: center;
    }
    .card {
      width: 100%;
      height: 200px;
      align-items: center;
      border: 2px solid;
      margin: 0 auto;
      text-align: center;
      border-radius: 12px;
    }
    .hop {
      width: 100%;
      height: 200px;
      align-items: center;
      border: 2px solid;
      margin: 0 auto;
      text-align: center;
      border-radius: 12px;
    }
    .red {
      background-color: red;
    }
    .gray {
      background-color: gray;
    }
    .btn-bai5{
    }
    div{
      width: 100%;
      height: 200px;
      align-items: center;
      border: 2px solid;
      margin: 0 auto;
      text-align: center;
      border-radius: 12px;
    }
    .active{
      background-color: red;
      color: white;
    }
  </style>
  <script>
    //Bài 1
    const test_bai1 =document.querySelector("p");
    test_bai1.textContent ="Lấy được mỗi thẻ đầu tiên mà chúng gặp phải"
    // const bai1 = document.querySelectorAll("p");
    // bai1.forEach((x)=> x.textContent ="Đẹp trai vc");
    //Bài 2
    function chao(){
        let user={Name:"Ngô Duy Anh" , age:20}
        const bai2= document.querySelector("h1");
        bai2.textContent =` Xin Chào ${user.Name}`;
        bai2.classList.toggle("active")
    }
    //Bai 3
    function ClickDiv(){
        const bai3 =document.querySelectorAll(".card");
        bai3.forEach((x) => x.style.color="blue");
    }
    //bai4
    function ClickRed(){
        const bai4_1 =document.querySelector(".hop");
        bai4_1.style.backgroundColor="red";
    }
    function ClickGray(){
        const bai4_2 =document.querySelector(".hop");
        bai4_2.style.backgroundColor="gray";
    }
    //Bài 5
    function ClickBai5(){
        const bai5=document.querySelector(".Bai5");
        bai5.classList.toggle("active");
    }
  </script>
</html>
