<!DOCTYPE html>
<html lang="vi">
    <head>
         <meta charset="UTF-8">
         <title> Trang đang nhập</title>
    </head>
    <body>
        
         <form>
            <label for="username">Tài khoản</label>
            <br>
            <input
             id="username"
             type="text"
             placeholder="Nhập tài khoản"
             required>
            <br><br>
            <label for="password">Mật khẩu</label>
            <br>
            <input
             id="password"
             type="password"
             placeholder="Nhập mật khẩu"
             required>
             <br>
             <input
             type="checkbox"
             required
             checked> Đồng ý với điều khoản của chúng tôi
            <br><br>
             <button>
             Đăng nhập
             </button>
         </form>
    </body>
</html>
